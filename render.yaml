services:
  - type: web
    name: production-planning
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: production-planning-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PLANNER_INITIAL_PASSWORD
        generateValue: true
      - key: EMPLOYEE_INITIAL_PASSWORD
        generateValue: true
databases:
  - name: production-planning-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: production_planning
    user: production_app
    ipAllowList: []
